[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/i18n",
    "crates/model",
]

[workspace.package]
version = "0.10.0"
edition         = "2024"
rust-version    = "1.91"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/apimokka/apimokka"

[workspace.dependencies]
apimokka-i18n               = { version = "0", path = "crates/i18n" }
apimokka-model              = { version = "0", path = "crates/model" }

# API service
apimock-routing             = "5"
http                        = "1.4"

# GUI stack
iced                        = { version = "0.14", features = ["tokio", "advanced"] }
snora                       = { version = "0.29", features = ["widgets", "design"] }

# Utility
serde_json                  = "1"
uuid                        = { version = "1", features = ["v4"] }

[profile.dev]
opt-level       = 0
debug           = 1

[profile.release]
opt-level       = 3
lto             = "thin"
