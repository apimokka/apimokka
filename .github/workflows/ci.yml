name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.91"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: A CJK font for the headless layout matrix (Linux)
        if: runner.os == 'Linux'
        run: |
          # The matrix's Japanese cells need a CJK font on the runner; the
          # test fails loudly without one rather than pass on narrower labels.
          if ! fc-list :lang=ja | grep -q .; then
            sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          fi

      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
