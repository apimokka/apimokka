[package]
name        = "apimokka-model"
description = "Workspace, snapshot, edit-command, and trace data types for the apimokka GUI."
readme      = "README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
http.workspace              = true
serde_json.workspace        = true
uuid.workspace              = true

[dev-dependencies]
# RFC MK-055: test-only engine-contract conformance oracle. Not a production
# dependency — see scripts/check-engine-oracle.sh for the pinned identity.
apimock-config               = "6"
tempfile                     = "3"

[features]
contract-test-support = []
